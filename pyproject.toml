[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "metodos-numericos-eta"
version = "1.0.0"
description = "Metodos numericos para analise do consumo de energia de um data center - Grupo Eta"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
    { name = "Grupo Eta" },
]
keywords = ["metodos numericos", "integracao numerica", "regra dos trapezios", "energia"]
dependencies = []

[project.urls]
Repository = "https://github.com/GuilhermeADS13/Grupo-Eta-Metodos-Numericos"

[tool.setuptools]
packages = ["projeto_2GQ.analise_energia"]

[tool.setuptools.package-data]
"projeto_2GQ.analise_energia" = ["*.csv"]
